name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --bin anvil

      - name: Smoke test release binary
        shell: pwsh
        run: |
          .\target\release\anvil.exe --version
          .\target\release\anvil.exe skills list --json
          .\target\release\anvil.exe bundle print-recipe

      - name: Stage release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\anvil.exe dist\anvil-windows-x86_64.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: anvil-windows-x86_64.exe
          path: dist/anvil-windows-x86_64.exe

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the workspace version
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -match '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') {
            $version = $Matches[1]
          } else {
            Write-Error "Could not extract workspace version from Cargo.toml"
            exit 1
          }
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "tag $($env:GITHUB_REF_NAME) does not match Cargo.toml version $version"
            exit 1
          }

      - name: Download the tested binary
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 anvil-windows-x86_64.exe).Hash.ToLowerInvariant()
          "$hash  anvil-windows-x86_64.exe" | Set-Content -NoNewline SHA256SUMS
          "`n" | Add-Content -NoNewline SHA256SUMS
          Get-Content SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @'
          Toolchain nativo portátil e offline para agentes de IA no Windows x86_64: Clang/LLVM (llvm-mingw),
          Rust, CMake/Ninja, clangd e rust-analyzer atrás de um único binário multicall e de um servidor MCP.

          ## Downloads

          | Arquivo | Plataforma |
          |---------|------------|
          | `anvil-windows-x86_64.exe` | Windows x86_64 |
          | `SHA256SUMS` | SHA-256 do binário |

          Monte o pendrive a partir das fontes oficiais:

          ```powershell
          anvil.exe bundle init-usb --usb E:\anvil
          anvil.exe bundle sync --usb E:\anvil
          anvil.exe bundle verify --usb E:\anvil
          ```

          Depois rode `install.ps1` (ou `.\anvil.exe install --yes`) a partir do pendrive.
          Detalhes no README.
          '@ | Set-Content -Encoding utf8 notes.md
          gh release create $env:GITHUB_REF_NAME `
            --verify-tag `
            --title "anvil $($env:GITHUB_REF_NAME)" `
            --notes-file notes.md `
            dist/anvil-windows-x86_64.exe dist/SHA256SUMS
